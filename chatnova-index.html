async function mic(){if(rec){rec.stop();return}try{const s=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[],r=new MediaRecorder(s,{audioBitsPerSecond:16000});rec=r;let sz=0;r.ondataavailable=x=>{ch.push(x.data);sz+=x.data.size;if(sz>120000&&rec==r)r.stop()};r.onstop=()=>{s.getTracks().forEach(t=>t.stop());rec=null;$('#mc').textContent='🎤';const f=new FileReader;f.onload=()=>f.result.length>240000?toast('Voice bahut lamba hai'):send({kind:'audio',url:f.result});f.readAsDataURL(new Blob(ch,{type:r.mimeType}))};r.start(1000);$('#mc').textContent='⏹';toast('Recording… bhejne ke liye ⏹ dabao');setTimeout(()=>rec==r&&r.stop(),30000)}catch(x){toast('Mic error: '+(x.name||x))}}
